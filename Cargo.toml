[package]
name = "dana_nameserver"
version = "0.1.0"
edition = "2024"

[profile.release]
# Optimize for size
opt-level = "z"      # Optimize for size instead of speed
lto = "fat"          # Full Link Time Optimization
codegen-units = 1    # Better optimization, slightly slower compile
panic = "abort"      # Smaller binary (no unwinding code)
strip = true         # Strip symbols from binary

[dependencies]
anyhow = "1.0"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
axum = { version = "0.8.5", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "native-tls-vendored"] }
dotenv = "0.15"
log = "0.4"
env_logger = "0.10"
dnssec-prover = { version = "0.6.10", features = ["tokio", "std"] }
silentpayments = { git = "https://github.com/cygnet3/spdk", rev = "71649ed6647dec8235fd3e8fa5db4f3991db90fc", default-features = false, features = ["encode"] }
spdk-wallet = { git = "https://github.com/cygnet3/spdk", rev = "71649ed6647dec8235fd3e8fa5db4f3991db90fc", package = "spdk-wallet", default-features = false }

[dev-dependencies]
wiremock = "0.6"
